<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam Masterplan 3D Test</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#080808;color:#fff;font-family:system-ui,sans-serif}
    .prelude{height:320vh;position:relative;background:#080808}
    .prelude p{position:sticky;top:45vh;margin:0;text-align:center;opacity:.65;padding:0 24px}
    #services{height:400vh;position:relative}
    .services-sticky{position:sticky;top:0;height:100vh;background:#111;overflow:hidden}
    .h-scroll-scene{position:relative;width:100%;height:100%}
    .status{position:absolute;z-index:2;left:20px;top:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;pointer-events:none}
    .after{height:100vh;display:grid;place-items:center;background:#080808}
  </style>
</head>
<body>
  <section class="prelude"><p>Scroll down — 3D should lazy-load only near #services</p></section>
  <section id="services">
    <div class="services-sticky">
      <div class="h-scroll-scene">
        <div class="status">Adam masterplan / Three.js test</div>
<div class="scene3d" data-scene3d>
  <canvas data-scene3d-canvas></canvas>
</div>

<style>
  .scene3d{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    contain:strict;
  }
  .scene3d canvas{
    display:block; width:100%; height:100%;
    opacity:0; transition:opacity .7s ease;
  }
  .scene3d[data-ready] canvas{ opacity:1; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
(() => {
  'use strict';

  const CONFIG = {
    // ↓↓↓ THE ONLY LINE TO CHANGE ↓↓↓
    modelUrl: './model/adam-masterplan.min.glb',
    // ↑↑↑ THE ONLY LINE TO CHANGE ↑↑↑

    preloadMargin: '150% 0px',
    maxDpr: 1.75,
    maxDprMobile: 1.4,
    damping: 0.09,
    accent: 0xc8f542,
    debug: false
  };

  const KEYFRAMES = [
    { azimuth:  30, elevation: 34, zoom: 1.00, panX:  0.00, panZ: 0.00 },
    { azimuth:   4, elevation: 19, zoom: 0.60, panX:  0.16, panZ: 0.04 },
    { azimuth: -26, elevation: 56, zoom: 0.74, panX: -0.14, panZ: 0.00 },
    { azimuth: -56, elevation: 27, zoom: 0.92, panX: -0.02, panZ: 0.02 }
  ];

  const root   = document.querySelector('[data-scene3d]');
  const canvas = root && root.querySelector('[data-scene3d-canvas]');
  const track  = document.querySelector('#services') || (root && root.closest('.h-scroll'));
  if (!root || !canvas || !track) return;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = matchMedia('(max-width: 767px)').matches;

  const supported = (() => {
    try {
      const c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl'));
    } catch (e) { return false; }
  })();
  if (!supported) return;

  let booted = false;
  const io = new IntersectionObserver((entries) => {
    if (booted || !entries.some(e => e.isIntersecting)) return;
    booted = true;
    io.disconnect();
    boot().catch(err => console.warn('[scene3d]', err));
  }, { rootMargin: CONFIG.preloadMargin });
  io.observe(track);

  async function boot () {
    const THREE = await import('three');
    const [{ GLTFLoader }, { MeshoptDecoder }] = await Promise.all([
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/libs/meshopt_decoder.module.js')
    ]);

    const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? CONFIG.maxDprMobile : CONFIG.maxDpr);

    const renderer = new THREE.WebGLRenderer({
      canvas, alpha: true,
      antialias: dpr < 1.5,
      powerPreference: 'high-performance',
      stencil: false
    });
    renderer.setPixelRatio(dpr);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 4000);

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    const gltf = await loader.loadAsync(CONFIG.modelUrl);
    const model = gltf.scene;

    const strip = [];
    model.traverse((o) => {
      if (o.isCamera || o.isLight) strip.push(o);
      if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; }
    });
    strip.forEach(o => o.parent && o.parent.remove(o));

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const centre = box.getCenter(new THREE.Vector3());
    model.position.sub(centre);
    scene.add(model);

    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    const radius = sphere.radius;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 1.9));

    const key = new THREE.DirectionalLight(0xfff6e8, 2.3);
    key.position.set(0.45, 1.0, 0.55).multiplyScalar(radius);
    scene.add(key);

    const rim = new THREE.DirectionalLight(CONFIG.accent, 0.85);
    rim.position.set(-0.7, 0.35, -0.6).multiplyScalar(radius);
    scene.add(rim);

    let w = 0, h = 0, fitDist = radius * 3;

    function computeFit () {
      const vFov = camera.fov * Math.PI / 180;
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      fitDist = Math.max(radius / Math.sin(vFov / 2), radius / Math.sin(hFov / 2));
    }

    function resize () {
      const r = root.getBoundingClientRect();
      const nw = Math.max(1, Math.round(r.width));
      const nh = Math.max(1, Math.round(r.height));
      if (nw === w && nh === h) return;
      w = nw; h = nh;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = h > w ? 50 : 38;
      camera.updateProjectionMatrix();
      computeFit();
      dirty = true;
    }

    new ResizeObserver(resize).observe(root);
    resize();

    let target = 0, current = 0, dirty = true;

    function readScroll () {
      const r = track.getBoundingClientRect();
      const total = r.height - window.innerHeight;
      target = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 0;
    }

    let queued = false;
    function onScroll () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; readScroll(); });
    }
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll, { passive: true });
    readScroll();
    current = target;

    const look = new THREE.Vector3();

    function apply (t) {
      const seg = t * (KEYFRAMES.length - 1);
      const i = Math.min(KEYFRAMES.length - 2, Math.floor(seg));
      const f = ease(seg - i);
      const a = KEYFRAMES[i], b = KEYFRAMES[i + 1];

      const az   = lerp(a.azimuth,   b.azimuth,   f) * Math.PI / 180;
      const el   = lerp(a.elevation, b.elevation, f) * Math.PI / 180;
      const zoom = lerp(a.zoom,      b.zoom,      f);
      const panX = lerp(a.panX,      b.panX,      f) * size.x;
      const panZ = lerp(a.panZ,      b.panZ,      f) * size.z;

      look.set(panX, 0, panZ);

      const d = fitDist * zoom;
      camera.position.set(
        look.x + Math.sin(az) * Math.cos(el) * d,
        look.y + Math.sin(el) * d,
        look.z + Math.cos(az) * Math.cos(el) * d
      );
      camera.lookAt(look);

      if (CONFIG.debug) {
        console.log('scroll', t.toFixed(3),
          'az', (az * 180 / Math.PI).toFixed(1),
          'el', (el * 180 / Math.PI).toFixed(1),
          'zoom', zoom.toFixed(2));
      }
    }

    let running = false, rafId = 0;

    function frame () {
      rafId = requestAnimationFrame(frame);
      const delta = target - current;
      if (Math.abs(delta) > 0.00015) {
        current += delta * (reduceMotion ? 1 : CONFIG.damping);
        dirty = true;
      } else if (current !== target) {
        current = target;
        dirty = true;
      }
      if (!dirty) return;
      dirty = false;
      apply(current);
      renderer.render(scene, camera);
    }

    const start = () => { if (!running) { running = true; dirty = true; frame(); } };
    const stop  = () => { if (running) { running = false; cancelAnimationFrame(rafId); } };

    new IntersectionObserver((entries) => {
      entries.some(e => e.isIntersecting) ? start() : stop();
    }, { rootMargin: '25% 0px' }).observe(track);

    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

    apply(current);
    renderer.render(scene, camera);
    root.setAttribute('data-ready', '');
    start();

    window.__scene3d = {
      preview (kf) {
        Object.assign(KEYFRAMES[Math.round(current * (KEYFRAMES.length - 1))], kf);
        dirty = true;
      },
      model, camera, scene, renderer
    };
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
})();
</script>
      </div>
    </div>
  </section>
  <section class="after">End of test</section>
</body>
</html>
