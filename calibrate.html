<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADAM masterplan — calibration</title>
<link rel="stylesheet" href="./calibrate/style.css">
</head>
<body>
<div id="app">
  <div id="stage"><div id="frame">
    <div class="scene3d" data-scene3d><canvas data-scene3d-canvas></canvas></div>
  </div></div>

  <div id="panel">
    <h2>Keyframe</h2>
    <div class="row" id="kfrow"></div>
    <div class="row">
      <button id="addKFBtn">+ Add keyframe</button>
      <button id="deleteKFBtn">Delete keyframe</button>
    </div>
    <div class="row"><button id="playBtn">▶ Play through</button><button id="copyPrevBtn">Copy previous</button></div>

    <h2>Camera</h2><div id="camCtls"></div>
    <h2>Building motion</h2><div id="motionCtls"></div>
    <h2>Lighting</h2><div id="lightCtls"></div>
    <h2>Building material</h2><div id="faceCtls"></div>
    <h2>Base plate</h2><div id="slabCtls"></div>
    <h2>Edges</h2><div id="edgeCtls"></div>
    <h2>Glow</h2><div id="glowCtls"></div>
    <h2>Isometric dots</h2>
    <div class="row tog"><button id="tAnimate">Animate dots</button></div>
    <div id="dotCtls"></div>

    <h2>Presets</h2><div class="row" id="presetRow"></div>

    <h2>View</h2>
    <div class="row tog">
      <button id="tPortrait">Portrait</button><button id="tGround">Ground</button><button id="tEdges">Edges</button>
      <button id="tGlow">Glow</button><button id="tDots">Dots</button><button id="tBounds">Bounds</button><button id="tGrid">Grid</button>
    </div>

    <h2>Export</h2>
    <button class="btn" id="copyBtn">Copy KEYFRAMES + STYLE</button>
    <button class="btn ghost" id="resetBtn">Reset to preset</button>
    <textarea id="out" readonly></textarea>

    <h2>Status</h2><div id="status">booting…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./calibrate/rim-glow-filter.js?v=65-20260820-0157"></script>
<script type="module" src="./calibrate/glow-bootstrap.js?v=cal-517-static-roof-bars-20260820-1205"></script>
</body>
</html>
