<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADAM masterplan — diagnostic</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* HUD is fixed and always visible, including on mobile where there is no console. */
  #hud{
    position:fixed; top:0; left:0; z-index:99999;
    max-width:min(92vw,560px); max-height:70vh; overflow:auto;
    background:rgba(0,0,0,.86); border-right:1px solid #333; border-bottom:1px solid #333;
    padding:8px 10px; font-size:11px; line-height:1.45;
    -webkit-overflow-scrolling:touch;
  }
  #hud b{color:#c8f542;}
  .ok{color:#7ee787;} .bad{color:#ff7b72;} .info{color:#9aa;} .warn{color:#e3b341;}

  .prelude{height:150vh;position:relative;}
  .prelude p{position:sticky;top:45vh;text-align:center;color:#888;}

  #services{height:400vh;position:relative;}

  /* The sticky frame. This is the containing block for .scene3d. */
  .frame{
    position:sticky; top:0; height:100vh; overflow:hidden;
    background:#141414;
  }

  /* Deliberately mirrors the production embed, including contain:strict. */
  .scene3d{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    contain:strict;
  }
  .scene3d canvas{ display:block; width:100%; height:100%; }

  /* NOTE: the opacity gate from the production embed is intentionally REMOVED here,
     so a failed boot cannot masquerade as a blank scene. */

  .end{height:60vh;display:grid;place-items:center;color:#666;}
</style>
</head>
<body>

<div id="hud"><b>DIAGNOSTIC</b><br></div>

<div class="prelude"><p>Scroll down. Diagnostics run immediately — check the HUD.</p></div>

<div id="services">
  <div class="frame">
    <div class="scene3d" data-scene3d>
      <canvas data-scene3d-canvas></canvas>
    </div>
  </div>
</div>

<div class="end">End of test</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script>
  // Plain (non-module) script so it runs FIRST and catches module-level failures,
  // including import-map resolution errors which never reach a try/catch.
  window.__hud = document.getElementById('hud');
  window.__log = function (msg, cls) {
    const d = document.createElement('div');
    d.className = cls || 'info';
    d.textContent = msg;
    window.__hud.appendChild(d);
    console.log('[diag]', msg);
  };
  window.addEventListener('error', (e) => {
    window.__log('WINDOW ERROR: ' + (e.message || e.error), 'bad');
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__log('UNHANDLED REJECTION: ' + (e.reason && (e.reason.message || e.reason)), 'bad');
  });
  window.__log('stage 0 — page script running', 'ok');
</script>

<script type="module">
(async () => {
  const log = window.__log;
  const MODEL_URL = './model/adam-masterplan.min.glb';

  try {
    log('stage 1 — module script executing', 'ok');

    const root   = document.querySelector('[data-scene3d]');
    const canvas = root.querySelector('[data-scene3d-canvas]');
    const track  = document.querySelector('#services');
    log('stage 2 — root/canvas/track found: ' + !!root + '/' + !!canvas + '/' + !!track,
        (root && canvas && track) ? 'ok' : 'bad');

    // ---- THE KEY MEASUREMENT ----------------------------------------
    // If this reports ~0 height, the renderer is being sized to 1x1 and
    // everything downstream "succeeds" while drawing nothing.
    const rr = root.getBoundingClientRect();
    log('stage 3 — root rect: ' + Math.round(rr.width) + ' x ' + Math.round(rr.height),
        (rr.width > 10 && rr.height > 10) ? 'ok' : 'bad');
    if (rr.width < 10 || rr.height < 10) {
      log('  >> ROOT HAS NO SIZE. This is the failure. The canvas cannot paint.', 'bad');
      log('  >> Check that .frame is position:sticky/relative and has real height.', 'warn');
    }
    const cs = getComputedStyle(root);
    log('  root position=' + cs.position + ' contain=' + cs.contain + ' opacity=' + cs.opacity, 'info');
    log('  devicePixelRatio=' + (window.devicePixelRatio || 1) +
        ' innerHeight=' + window.innerHeight, 'info');

    log('stage 4 — importing three…');
    const THREE = await import('three');
    log('stage 4 — three r' + THREE.REVISION + ' loaded', 'ok');

    log('stage 5 — importing GLTFLoader + MeshoptDecoder…');
    const [{ GLTFLoader }, { MeshoptDecoder }] = await Promise.all([
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/libs/meshopt_decoder.module.js')
    ]);
    log('stage 5 — loaders resolved', 'ok');

    log('stage 6 — creating WebGLRenderer…');
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const renderer = new THREE.WebGLRenderer({
      canvas, alpha: false, antialias: dpr < 1.5,
      powerPreference: 'high-performance', stencil: false
    });
    renderer.setPixelRatio(dpr);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    const gl = renderer.getContext();
    log('stage 6 — renderer OK, ctx=' + (gl instanceof WebGL2RenderingContext ? 'webgl2' : 'webgl1'), 'ok');

    const scene = new THREE.Scene();
    // Diagnostic background: if you see NAVY, the canvas is alive and painting.
    // If you see the page grey (#141414), the canvas is dead or unsized.
    scene.background = new THREE.Color(0x0b1d3a);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 4000);

    // Reference cube at the origin, sized to the model's expected scale.
    // If the cube shows but the model does not, the fault is the model, not the pipeline.
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(12, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })
    );
    scene.add(cube);
    log('stage 7 — magenta reference cube added', 'ok');

    log('stage 8 — fetching model: ' + MODEL_URL);
    const head = await fetch(MODEL_URL, { method: 'GET' });
    log('stage 8 — HTTP ' + head.status + ' ' + (head.headers.get('content-length') || '?') +
        ' bytes, type=' + (head.headers.get('content-type') || '?'),
        head.ok ? 'ok' : 'bad');
    const bytes = await head.arrayBuffer();
    log('stage 8 — downloaded ' + bytes.byteLength + ' bytes (expect 75364)',
        bytes.byteLength === 75364 ? 'ok' : 'warn');

    log('stage 9 — parsing GLB…');
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const gltf = await new Promise((res, rej) => loader.parse(bytes, '', res, rej));
    const model = gltf.scene;
    log('stage 9 — GLB parsed', 'ok');

    let meshes = 0, lights = 0, cams = 0;
    model.traverse(o => { if (o.isMesh) meshes++; if (o.isLight) lights++; if (o.isCamera) cams++; });
    log('  meshes=' + meshes + ' lights=' + lights + ' cameras=' + cams +
        ' (expect 8 / 1 / 2)', meshes === 8 ? 'ok' : 'warn');

    const strip = [];
    model.traverse(o => { if (o.isCamera || o.isLight) strip.push(o); });
    strip.forEach(o => o.parent && o.parent.remove(o));

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const centre = box.getCenter(new THREE.Vector3());
    model.position.sub(centre);
    scene.add(model);
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    const radius = sphere.radius;
    log('stage 10 — bbox ' + size.toArray().map(v => v.toFixed(1)).join(' x ') +
        ' radius ' + radius.toFixed(1) + ' (expect 75.1 x 1.2 x 33.4, r 41.1)',
        Math.abs(radius - 41.1) < 1 ? 'ok' : 'bad');

    // Wireframe bounds so an invisible-but-present model still shows.
    scene.add(new THREE.Box3Helper(new THREE.Box3().setFromObject(model), 0x00ff00));
    log('stage 11 — green bounds helper added', 'ok');

    scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 1.9));
    const key = new THREE.DirectionalLight(0xfff6e8, 2.3);
    key.position.set(0.45, 1.0, 0.55).multiplyScalar(radius);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xc8f542, 0.85);
    rim.position.set(-0.7, 0.35, -0.6).multiplyScalar(radius);
    scene.add(rim);

    let w = 0, h = 0, fitDist = radius * 3;
    let target = 0, current = 0, dirty = true;

    function computeFit () {
      const vFov = camera.fov * Math.PI / 180;
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      fitDist = Math.max(radius / Math.sin(vFov / 2), radius / Math.sin(hFov / 2));
    }
    function resize () {
      const r = root.getBoundingClientRect();
      const nw = Math.max(1, Math.round(r.width));
      const nh = Math.max(1, Math.round(r.height));
      if (nw === w && nh === h) return;
      w = nw; h = nh;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = h > w ? 50 : 38;
      camera.updateProjectionMatrix();
      computeFit();
      dirty = true;
    }
    new ResizeObserver(resize).observe(root);
    resize();
    log('stage 12 — renderer sized to ' + w + ' x ' + h +
        ', drawing buffer ' + canvas.width + ' x ' + canvas.height,
        (w > 10 && h > 10) ? 'ok' : 'bad');

    const KEYFRAMES = [
      { azimuth:  30, elevation: 34, zoom: 1.00, panX:  0.00, panZ: 0.00 },
      { azimuth:   4, elevation: 19, zoom: 0.60, panX:  0.16, panZ: 0.04 },
      { azimuth: -26, elevation: 56, zoom: 0.74, panX: -0.14, panZ: 0.00 },
      { azimuth: -56, elevation: 27, zoom: 0.92, panX: -0.02, panZ: 0.02 }
    ];
    const lerp = (a, b, t) => a + (b - a) * t;
    const ease = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    const look = new THREE.Vector3();

    function apply (t) {
      const seg = t * (KEYFRAMES.length - 1);
      const i = Math.min(KEYFRAMES.length - 2, Math.floor(seg));
      const f = ease(seg - i);
      const a = KEYFRAMES[i], b = KEYFRAMES[i + 1];
      const az = lerp(a.azimuth, b.azimuth, f) * Math.PI / 180;
      const el = lerp(a.elevation, b.elevation, f) * Math.PI / 180;
      const zoom = lerp(a.zoom, b.zoom, f);
      look.set(lerp(a.panX, b.panX, f) * size.x, 0, lerp(a.panZ, b.panZ, f) * size.z);
      const d = fitDist * zoom;
      camera.position.set(
        look.x + Math.sin(az) * Math.cos(el) * d,
        look.y + Math.sin(el) * d,
        look.z + Math.cos(az) * Math.cos(el) * d
      );
      camera.lookAt(look);
    }

    function readScroll () {
      const r = track.getBoundingClientRect();
      const total = r.height - window.innerHeight;
      target = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 0;
    }
    addEventListener('scroll', () => { readScroll(); dirty = true; }, { passive: true });
    readScroll();
    current = target;

    apply(current);
    renderer.render(scene, camera);
    log('stage 13 — FIRST FRAME RENDERED', 'ok');
    log('  camera at ' + camera.position.toArray().map(v => v.toFixed(1)).join(', ') +
        ' | fitDist ' + fitDist.toFixed(1) + ' | scroll ' + current.toFixed(3), 'info');
    log('  canvas rect ' + Math.round(canvas.getBoundingClientRect().width) + ' x ' +
        Math.round(canvas.getBoundingClientRect().height) +
        ' opacity=' + getComputedStyle(canvas).opacity, 'info');

    // Diagnostic loop renders unconditionally so nothing hides behind the dirty flag.
    (function frame () {
      requestAnimationFrame(frame);
      const delta = target - current;
      if (Math.abs(delta) > 0.00015) current += delta * 0.09;
      apply(current);
      cube.rotation.y += 0.01;   // if the cube spins, the loop is alive
      renderer.render(scene, camera);
    })();

    log('stage 14 — render loop running. Scroll to move the camera.', 'ok');
    log('EXPECTED: navy background, magenta spinning cube, green bounds box, white model.', 'warn');

    window.__diag = { THREE, scene, camera, renderer, model, root, canvas };
  } catch (err) {
    window.__log('FAILED: ' + (err && (err.message || err)), 'bad');
    console.error(err);
  }
})();
</script>
</body>
</html>
