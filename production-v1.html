<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADAM Masterplan — Production V1</title>
  <style>
    html,body{margin:0;background:#f7f7f2;font-family:Arial,sans-serif;color:#111}
    .intro,.outro{height:70vh;display:grid;place-items:center;padding:2rem;text-align:center}
    .h-scroll{position:relative;height:500vh;background:#f7f7f2}
    .h-scroll-scene{position:sticky;top:0;height:100vh;overflow:hidden}
    .adam-masterplan-v1{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;contain:strict;overflow:hidden}
    .adam-masterplan-v1 canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .45s ease}
    .adam-masterplan-v1[data-ready] canvas{opacity:1}
    .meter{position:fixed;right:16px;bottom:16px;z-index:5;padding:8px 10px;background:rgba(255,255,255,.82);border:1px solid #ddd;border-radius:999px;font-size:12px;backdrop-filter:blur(10px)}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section class="intro"><div><h1>ADAM Masterplan Production V1</h1><p>Scroll into the test section. The 3D reads the actual <code>.h-scroll</code> progress.</p></div></section>

  <section class="h-scroll">
    <div class="h-scroll-scene">
      <div class="adam-masterplan-v1" data-adam-masterplan-v1><canvas aria-hidden="true"></canvas></div>
    </div>
  </section>

  <section class="outro"><h2>100%</h2></section>
  <div class="meter" id="meter">0.0%</div>

  <script type="module" src="./production/adam-masterplan-v1.js?v=1.0.0"></script>
  <script>
    const meter=document.getElementById('meter');
    const update=()=>{const el=document.querySelector('[data-adam-masterplan-v1]');meter.textContent=(el?.dataset.scrollPct||'0.0')+'%';requestAnimationFrame(update)};
    update();
  </script>
</body>
</html>
